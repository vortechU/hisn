name: dua_app
description: "Hisn — a Dua & Adhkar companion with a built-in Tasbih counter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.14.1+24

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  adhan: ^2.0.0+1
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0
  flutter_compass: ^0.8.1
  audioplayers: ^6.1.0
  geocoding: ^4.0.0
  slang_flutter: ^4.15.0
  hijri: ^3.0.1
  wakelock_plus: ^1.6.1
  # Backup & restore: a file picker to read a backup in, and the share sheet to
  # send one out (file_selector has no save dialog on Android).
  file_selector: ^1.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Generates the platform launcher icons from a single source image.
  flutter_launcher_icons: ^0.14.1
  slang: ^4.15.0

# Launcher-icon generation config (run: dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#072C3E"
  # Full-bleed logo as the adaptive foreground; the inset below supplies the
  # mask-safe margin (avoids double-padding with the pre-padded variant).
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_inset: 12
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/duas.json
    - assets/data/duas.id.json
    - assets/data/duas.ar.json
    - assets/data/categories.json
    - assets/data/tasbih.json
    - assets/data/quran/
    - assets/data/mushaf/
    - assets/audio/

  fonts:
    # Latin text faces. Crimson Pro carries content (headings, prose,
    # translations) — it is the Latin companion Amiri was designed to sit
    # beside. Karla carries the apparatus (labels, numerals, buttons). Both are
    # SIL OFL 1.1; instanced from the upstream variable fonts and subset to the
    # Latin ranges the app actually uses (see assets/fonts/latin/*-OFL.txt).
    - family: Crimson Pro
      fonts:
        - asset: assets/fonts/latin/CrimsonPro-Regular.ttf
        - asset: assets/fonts/latin/CrimsonPro-Italic.ttf
          style: italic
        - asset: assets/fonts/latin/CrimsonPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/latin/CrimsonPro-Bold.ttf
          weight: 700
    - family: Karla
      fonts:
        - asset: assets/fonts/latin/Karla-Regular.ttf
        - asset: assets/fonts/latin/Karla-Medium.ttf
          weight: 500
        - asset: assets/fonts/latin/Karla-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Alternative Arabic typefaces offered in Display settings (SIL OFL 1.1 —
    # see assets/fonts/arabic/LICENSE.txt).
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/arabic/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/arabic/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/arabic/NotoNaskhArabic-Regular.ttf
    # Madani Mushaf (KFGQPC QCF v4) page fonts — one per ~13 pages, plus the
    # decorative surah-header font (QBSML). Lazy-loaded by Flutter on first use.
    - family: QCF4_Hafs_01
      fonts:
        - asset: assets/fonts/quran/QCF4_Hafs_01.ttf
